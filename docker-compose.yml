version: "3.9"
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  server:
    build: ./server
    env_file: ./server/.env
    depends_on:
      - mongo
    ports:
      - "5000:5000"

  client:
    build: ./client
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - server
    ports:
      - "5173:80"

volumes:
  mongo_data:
